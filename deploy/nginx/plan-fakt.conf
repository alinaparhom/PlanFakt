# plan-fakt.bimmax.pro — «План / Факт» перед контейнером plan-fakt (порт 4173).
#
# Ставится на тот же сервер, что и bimmax.pro: приложение слушает только
# 127.0.0.1, наружу его отдаёт nginx по HTTPS. Telegram Mini App работает
# исключительно по HTTPS, поэтому HTTP оставлен лишь под проверку certbot
# и перенаправление.
#
# Файл кладётся в /etc/nginx/sites-available/plan-fakt.conf и включается
# ссылкой из sites-enabled. Сертификат выпускается certbot до включения
# HTTPS-блока (см. deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name plan-fakt.bimmax.pro;

    # Проверка домена certbot остаётся доступной по HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Отдельная директива появилась в nginx 1.25.1. На более старом сервере
    # её убирают, а http2 включают прямо в listen: «listen 443 ssl http2;».
    http2 on;
    server_name plan-fakt.bimmax.pro;

    ssl_certificate     /etc/letsencrypt/live/plan-fakt.bimmax.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan-fakt.bimmax.pro/privkey.pem;

    # Отчёт несёт фотографии, а импорт ведомости — файл Excel. Приложение само
    # держит лимиты 25 МБ на запрос и 40 МБ на импорт (server.js), поэтому у
    # nginx запас выше: иначе он обрежет запрос раньше и вернёт свою 413-ю
    # вместо понятной ошибки приложения.
    client_max_body_size 48m;

    # Разбор .xlsb идёт через Python и на больших ведомостях занимает минуты.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Сессия приложения ставится с флагом Secure — без этого заголовка
        # cookie не закрепится за Telegram WebView.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Проверка живости контейнера: обычный маршрут приложения, но без записи
    # в журнал доступа — его дёргает и Telegram-настройка, и мониторинг.
    location = /api/health {
        proxy_pass http://127.0.0.1:4173/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
